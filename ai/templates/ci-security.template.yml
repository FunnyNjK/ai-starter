name: Security Guardrails

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 2 * * 0' # Weekly

jobs:
  dependency-update-config:
    name: Dependency update config required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require Dependabot or Renovate
        run: |
          test -f ".github/dependabot.yml" || test -f "renovate.json" || test -f ".github/renovate.json"

  sast-config:
    name: Real SAST workflow required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require language-specific SAST
        run: |
          while IFS= read -r workflow; do
            if ! grep -q "Real SAST workflow required" "$workflow"; then
              echo "Language-specific SAST workflow found: $workflow"
              exit 0
            fi
          done < <(find .github/workflows -maxdepth 1 -type f \
            \( -name "*codeql*.yml" -o -name "*codeql*.yaml" \
               -o -name "*sast*.yml" -o -name "*sast*.yaml" \
               -o -name "*security-scan*.yml" -o -name "*security-scan*.yaml" \))

          echo "No real SAST workflow found."
          echo "Replace this guard with CodeQL, Bandit, Semgrep, Trivy, or the scanner chosen in /ai/DECISIONS.md."
          exit 1
