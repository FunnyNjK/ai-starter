name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shellcheck (phase scripts + shared lib)
        run: |
          shellcheck \
            scripts/run-phase-lib.sh \
            run-phase.sh \
            run-phase-codex.sh \
            run-phase-cursor.sh \
            run-phase-copilot.sh

  planning-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate Python helper scripts
        run: python3 -m py_compile scripts/lint-planning.py scripts/mark-task-done.py
      - name: Lint planning markdown
        run: python3 scripts/lint-planning.py
